<!DOCTYPE html>
<html>
<body>

<h1>The img longdesc attribute</h1>

<!-- The description is on the same page as the image -->
<img src="t.svg" alt="W3Schools.com" width="100" height="132" longdesc="#w3htmlExplained">

<!-- The description is in an external page -->
<img src="t.svg" alt="W3Schools.com" width="100" height="132" longdesc="w3html.txt">

<!-- The description is one of several within an external page -->
<img src="t.svg" alt="W3Schools.com" width="100" height="132" longdesc="http://example.com/desc#item3">

<!-- The description is included in a data:URI -->
<img src="t.svg" alt="W3Schools.com" width="100" height="132" longdesc="data:text/html;charset=utf-8;,<script>alert()</script>">


<div id="w3htmlExplained">
  <h2>Image t.svg</h2>
  <p>Description of the image...</p>
</div>

</body>
</html>
